<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">GE Vernova grid orders and pending Trench acquisition</title><desc id="d">A power pylon represents current grid demand, while a bushing represents a separate pending acquisition and capital-return test.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#87d4df" stroke-width="1.4"/></marker></defs><rect width="960" height="600" rx="20" fill="#182d29"/><g font-family="Arial,sans-serif"><text x="42" y="54" font-size="29" fill="#f2f4f8">GE VERNOVA / GRID DEMAND + DEAL RISK</text><text x="42" y="90" font-size="20" fill="#bad0ba">Q3 results and Trench agreement | 28 OCT 2026</text><rect x="43" y="140" width="405" height="300" rx="14" fill="#253f36" stroke="#648776" stroke-width="2"/><text x="65" y="180" font-size="21" fill="#d5e9a4">POWER AND GRID DEMAND</text><path d="M155 209l-39 132h78zM128 245h55M121 274h68M110 341h92M128 211h55M115 230h80" stroke="#e5cf92" fill="none" stroke-width="5"/><text x="238" y="240" font-size="20" fill="#f2f4f8">Orders</text><text x="238" y="274" font-size="33" fill="#d5e9a4">$29B</text><text x="238" y="323" font-size="20" fill="#f2f4f8">Revenue</text><text x="238" y="357" font-size="31" fill="#f2f4f8">$12.6B</text><text x="65" y="414" font-size="25" fill="#f2f4f8">RPO backlog: $197B</text><rect x="505" y="140" width="411" height="300" rx="14" fill="#46362a" stroke="#b48c64" stroke-width="2"/><text x="529" y="180" font-size="21" fill="#f5c990">TRENCH ACQUISITION</text><path d="M570 327V212h37v115M550 235h77M550 250h77M550 265h77M550 280h77M550 295h77M541 335h94" fill="none" stroke="#f5c990" stroke-width="6"/><text x="659" y="240" font-size="20" fill="#f2f4f8">Deal value</text><text x="659" y="274" font-size="33" fill="#f5c990">~$9B</text><text x="659" y="321" font-size="18" fill="#f2f4f8">Expected close</text><text x="659" y="354" font-size="27" fill="#f2f4f8">Late 2027</text><text x="529" y="414" font-size="23" fill="#f2f4f8">Approval + integration + ROIC</text><path d="M456 285L491 285" fill="none" stroke="#87d4df" stroke-width="4" marker-end="url(#a)"/><rect x="43" y="468" width="873" height="64" rx="14" fill="#223e36" stroke="#648776" stroke-width="2"/><text x="64" y="509" font-size="23" fill="#d5e9a4">Stronger demand does not automatically mean a good acquisition.</text><text x="42" y="571" font-size="17" fill="#a7c1ae">CONCEPTUAL EQUIPMENT | Deal pending; announced value is not current revenue</text></g></svg>