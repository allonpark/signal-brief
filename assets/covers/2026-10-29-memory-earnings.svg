<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Memory operating earnings versus special investment returns</title><desc id="d">HBM stack, DRAM and SSD lead to operating earnings; a separate investment-gain path leads to a special distribution.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#87d4df" stroke-width="1.4"/></marker></defs><rect width="960" height="600" rx="20" fill="#102532"/><g font-family="Arial,sans-serif"><text x="42" y="54" font-size="30" fill="#f2f4f8">SK HYNIX / TWO DIFFERENT RETURN PATHS</text><text x="42" y="90" font-size="19" fill="#9bbfca">Q3 2026 preliminary results | Released 28 OCT 2026</text><path d="M63 270l90-29 90 29-90 30z" fill="#35778a" stroke="#c6eeee" stroke-width="2"/><path d="M63 247l90-29 90 29-90 30z" fill="#448da0" stroke="#c6eeee" stroke-width="2"/><path d="M63 224l90-29 90 29-90 30z" fill="#55a6b8" stroke="#c6eeee" stroke-width="2"/><path d="M63 201l90-29 90 29-90 30z" fill="#79c5d0" stroke="#c6eeee" stroke-width="2"/><path d="M63 178l90-29 90 29-90 30z" fill="#9edce0" stroke="#c6eeee" stroke-width="2"/><text x="119" y="333" font-size="27" fill="#d8ed85">HBM</text><rect x="291" y="170" width="150" height="130" rx="14" fill="#193648" stroke="#477383" stroke-width="2"/><text x="316" y="250" font-size="27" fill="#f2f4f8">DRAM</text><rect x="488" y="170" width="150" height="130" rx="14" fill="#193648" stroke="#477383" stroke-width="2"/><path d="M510 193h105" stroke="#e7be84" stroke-width="9"/><path d="M510 211h105" stroke="#e7be84" stroke-width="9"/><path d="M510 229h105" stroke="#e7be84" stroke-width="9"/><text x="532" y="279" font-size="24" fill="#f2f4f8">SSD</text><path d="M665 236L710 236" fill="none" stroke="#87d4df" stroke-width="4" marker-end="url(#a)"/><rect x="735" y="147" width="181" height="193" rx="14" fill="#254537" stroke="#759b68" stroke-width="2"/><text x="755" y="1