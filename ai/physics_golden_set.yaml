case_schema:
  id: string
  question: string
  source_context: optional
  protected_facts:
    - numbers
    - units
    - bias_conditions
    - temperatures
    - times
    - geometries
    - materials
  expected:
    causal_chain: required
    equations: optional
    competing_mechanisms: required_for_analysis
    dominance_boundaries: required_for_analysis
    observable_signatures: required
    discriminating_doe: required_when_ambiguous
    uncertainty: required
  scoring:
    physics_correctness: 0_to_5
    evidence_fidelity: 0_to_5
    numerical_correctness: pass_fail
    competing_mechanism_coverage: 0_to_5
    boundary_condition_quality: 0_to_5
    experimental_verifiability: 0_to_5
